services:
  - type: worker
    name: telegram-zip-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MAX_ZIP_BYTES
        value: "20971520"
      - key: MAX_EXTRACTED_BYTES
        value: "209715200"
        
